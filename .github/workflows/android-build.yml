name: Build Pomme Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Pomme (including submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
  uses: android-actions/setup-android@v3
  with:
    packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Rust
        run: |
          rustup show
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          cargo install just

      - name: Build APK
        run: just android-build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pomme-android-arm64-debug-apk
          path: pomme-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
